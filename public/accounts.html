<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASLOG Account</title>
  <link rel="stylesheet" href="accounts.css" />
</head>
<body>
  <div class="account-page theme-blossom" id="accountPage">
    <header class="top-bar">
      <div></div>

      <div class="title-wrapper">
        <div class="title-box">🌸 MASLOG 🌼</div>
      </div>

      <div class="theme-picker-wrap">
        <label class="theme-label" for="themeSelect">Theme</label>
        <select id="themeSelect" class="theme-select">
          <option value="blossom">Blossom</option>
          <option value="sunflower">Sunflower</option>
          <option value="lavender">Lavender</option>
          <option value="rose">Rose</option>
        </select>
      </div>
    </header>

    <main class="account-content">
      <section class="account-card">
        <div class="card-glow"></div>

        <h1 class="account-title" id="formTitle">Log In</h1>
        <p class="account-subtitle" id="formSubtitle">
          Welcome back to MASLOG.
        </p>

        <form class="account-form" id="accountForm">
          <label class="field-group">
            <span>Email</span>
            <input type="email" id="email" placeholder="Enter your email" required />
          </label>

          <label class="field-group">
            <span>Password</span>
            <input type="password" id="password" placeholder="Enter your password" required />
          </label>

          <label class="field-group hidden" id="confirmPasswordGroup">
            <span>Confirm Password</span>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" />
          </label>

          <button class="submit-btn" id="submitBtn" type="submit">Log In</button>
        </form>

        <div class="account-links">
          <button class="text-action-btn" id="toggleFormBtn" type="button">
            Don’t have an account? Sign Up
          </button>

          <button class="text-action-btn" id="resetPasswordBtn" type="button">
            Forgot your password?
          </button>
        </div>

        <p class="status-message" id="statusMessage"></p>
      </section>
    </main>
  </div>

  <script type="module" src="accounts.js"></script>
</body>
</html>
